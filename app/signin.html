  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Same newspaper look as the app (see app/index.html). */
    :root {
      --paper: #faf8f3; --ink: #1b1b1b; --muted: #6d6a63; --faint: #a8a39a; --hair: #d9d4c9;
      --accent: #8a1c1c; --keep: #2f5d34;
      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --display: "Playfair Display", Georgia, serif;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--serif); background: var(--paper); color: var(--ink); line-height: 1.5; }
    .page { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }
    @media (max-width: 600px) { .page { padding: 0 16px 48px; } }
    .masthead { text-align: center; padding-top: 28px; }
    .masthead h1 { font-family: var(--display); font-weight: 900; font-size: clamp(44px, 8vw, 84px); letter-spacing: -0.01em; margin: 0; line-height: 1; }
    .edition { display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px 16px; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); margin-top: 14px; padding: 6px 0; font-size: 13px; font-variant: small-caps; letter-spacing: 0.06em; }
    .edition span:first-child { text-align: left; }
    .edition span:last-child { text-align: right; }
    @media (max-width: 520px) { .edition { grid-template-columns: 1fr; } .edition span { text-align: center !important; } .edition span:empty { display: none; } }
    .wrap { max-width: 420px; margin: 0 auto; padding-top: 36px; }
    .sub { color: var(--muted); font-style: italic; text-align: center; margin: 0 0 24px; }
    h2 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0 0 8px; padding: 6px 0 5px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); }
    label { display: block; font-family: var(--sans); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; margin: 16px 0 4px; }
    input { width: 100%; padding: 8px 2px; font-size: 16px; font-family: inherit; color: var(--ink); border: 0; border-bottom: 1px solid var(--faint); border-radius: 0; background: transparent; }
    input:focus { outline: none; border-color: var(--ink); }
    .hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    button { font-family: var(--sans); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; padding: 10px 16px; border-radius: 0; cursor: pointer; border: 1px solid var(--ink); background: transparent; color: var(--ink); }
    button.primary { background: var(--ink); color: var(--paper); width: 100%; margin-top: 22px; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.link { border: none; background: none; color: var(--ink); padding: 0; text-decoration: underline; font-size: 12px; }
    .switch { margin: 18px 0 0; font-size: 14px; color: var(--muted); text-align: center; }
    .message { margin: 14px 0 0; font-family: var(--sans); font-size: 13px; }
    .message.error { color: var(--accent); }
    .message.ok { color: var(--keep); }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>Press Pass</h1>
      <div class="edition"><span id="edition-date"></span><span></span><span id="edition-week"></span></div>
    </header>
  <div class="wrap">
    <p class="sub">Build a weekly news roundup for a PR client. Sign in to save your client setups and past newsletters.</p>

    <section>
      <h2 id="form-title">Sign in</h2>
      <form id="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" minlength="6" required />
        <p class="hint" id="password-hint" hidden>At least 6 characters.</p>
        <button type="submit" class="primary" id="submit">Sign in</button>
        <p class="message" id="message" hidden></p>
      </form>
      <p class="switch">
        <span id="switch-text">New here?</span>
        <button type="button" class="link" id="switch-mode">Create an account</button>
      </p>
    </section>
  </div>
  </div>
  <script>
    // Edition line: today's date on the left, the week it covers on the right (same as the app).
    (function () {
      const today = new Date(), weekAgo = new Date(today - 7 * 86400000);
      document.getElementById("edition-date").textContent = today.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      const sameMonth = weekAgo.getMonth() === today.getMonth();
      document.getElementById("edition-week").textContent = "Week of " + weekAgo.toLocaleDateString("en-US", { month: "short", day: "numeric" }) +
        " – " + today.toLocaleDateString("en-US", sameMonth ? { day: "numeric" } : { month: "short", day: "numeric" });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
  <script src="/auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let mode = "signin"; // or "signup"

    function track(event, props = {}) {
      try { if (window.posthog) posthog.capture(event, props); } catch (e) { /* analytics must never break the app */ }
    }

    function showMessage(text, kind = "error") {
      $("message").textContent = text;
      $("message").className = `message ${kind}`;
      $("message").hidden = !text;
    }

    function setMode(next) {
      mode = next;
      const signup = mode === "signup";
      $("form-title").textContent = signup ? "Create an account" : "Sign in";
      $("submit").textContent = signup ? "Create account" : "Sign in";
      $("switch-text").textContent = signup ? "Already have an account?" : "New here?";
      $("switch-mode").textContent = signup ? "Sign in" : "Create an account";
      $("password").autocomplete = signup ? "new-password" : "current-password";
      $("password-hint").hidden = !signup;
      showMessage("");
    }

    $("switch-mode").addEventListener("click", () => setMode(mode === "signin" ? "signup" : "signin"));

    // Already signed in? Go straight to the app.
    PressPassAuth.getClient().then(async (client) => {
      if (!client) {
        showMessage("Sign-in isn't set up yet: add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY to .env and restart the server.");
        $("submit").disabled = true;
        return;
      }
      const { data } = await client.auth.getSession();
      if (data.session) location.replace("/");
    });

    $("auth-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const client = await PressPassAuth.getClient();
      if (!client) return;
      const email = $("email").value.trim();
      const password = $("password").value;
      $("submit").disabled = true;
      showMessage("");
      try {
        const { data, error } = mode === "signup"
          ? await client.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + "/signin.html" } })
          : await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (!data.session) {
          // "Confirm email" is on in Supabase: the account works after the link is clicked.
          setMode("signin");
          showMessage("Check your email for a confirmation link, then sign in.", "ok");
          return;
        }
        PressPassAuth.identify(data.session.user);
        track(mode === "signup" ? "signed_up" : "signed_in");
        location.replace("/");
      } catch (err) {
        showMessage(err.message || "Something went wrong. Please try again.");
      } finally {
        $("submit").disabled = false;
      }
    });
  </script>
</body>
</html>
